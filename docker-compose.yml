services:
  gitlab-runners:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitlab-runners-multi
    restart: unless-stopped

    # Required for Docker-in-Docker functionality
    privileged: true

    volumes:
      # Mount Docker socket for Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock

      # Persist runner configuration using named volume
      - gitlab-runner-config:/etc/gitlab-runner

      # Mount runners.json from current directory
      # Make sure runners.json exists before starting!
      - ./runners.json:/etc/gitlab-runner/runners.json:ro

      # Cache directory
      - gitlab-runner-cache:/cache

    environment:
      # Required variables
      - CI_SERVER_URL=${CI_SERVER_URL}
      - REGISTRATION_TOKEN=${REGISTRATION_TOKEN}

      # Use JSON config file
      - RUNNER_CONFIG_FILE=/etc/gitlab-runner/runners.json

    # Health check
    healthcheck:
      test: ["CMD", "gitlab-runner", "verify"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - gitlab-runner-network

volumes:
  gitlab-runner-config:
    driver: local
  gitlab-runner-cache:
    driver: local

networks:
  gitlab-runner-network:
    driver: bridge
